name: AAPS CI

on:
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Select AAPS Version'
        required: true
        default: '3.4.2.2'
        type: choice
        options:
          - 3.4.2.2
          - 3.4.2.1
          - 3.4.2.0
      buildVariant:
        description: 'Select Build Variant'
        required: true
        default: 'fullRelease'
        type: choice
        options:
          - fullRelease
          - pumpcontrolRelease

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decode Secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_SET }}" ]; then
            DECODED=$(echo "${{ secrets.KEYSTORE_SET }}" | base64 -d)
            IFS='|' read -r K_B64 K_PASS K_ALIAS K_KEY <<< "$DECODED"
            {
              echo "KEYSTORE_BASE64=$K_B64"
              echo "KEYSTORE_PASSWORD=$K_PASS"
              echo "KEY_ALIAS=$K_ALIAS"
              echo "KEY_PASSWORD=$K_KEY"
            } >> "$GITHUB_ENV"
          else
            {
              echo "KEYSTORE_BASE64=${{ secrets.KEYSTORE_BASE64 }}"
              echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
              echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
          fi

      - name: Write keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Checkout tag
        run: |
          git remote add upstream https://github.com/nightscout/AndroidAPS.git || true
          git fetch upstream refs/tags/${{ inputs.tagName }}:refs/tags/${{ inputs.tagName }}
          git checkout refs/tags/${{ inputs.tagName }}

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assemble${{ inputs.buildVariant }} :wear:assemble${{ inputs.buildVariant }} \
            -Pandroid.injected.signing.store.file=$PWD/keystore.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Collect APKs
        run: |
          VERSION=${{ inputs.tagName }}
          find app/build/outputs/apk -name "*.apk" -exec cp {} aaps-$VERSION.apk \;
          find wear/build/outputs/apk -name "*.apk" -exec cp {} aaps-wear-$VERSION.apk \;
          ls -lh aaps*.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AAPS-${{ inputs.tagName }}
          path: aaps-*.apk
          
