name: AAPS CI

on:
  workflow_dispatch:
    inputs:
      aaps_version:
        description: 'Branch or tag to build'
        required: true
        default: '4.0.0'
      build_variant:
        description: 'Build variant (fullRelease)'
        required: true
        default: 'fullRelease'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: 'nightscout/AndroidAPS'
          ref: ${{ github.event.inputs.aaps_version }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > app/app.jks

      - name: Build AAPS
        run: |
          ./gradlew assembleFullRelease \
            -Pandroid.injected.signing.store.file=app.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEYSTORE_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAPS-${{ github.event.inputs.aaps_version }}
          path: app/build/outputs/apk/full/release/*.apk
